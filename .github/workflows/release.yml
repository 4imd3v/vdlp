name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./...
          go test -race ./...
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .
          test -z "$(gofmt -l .)"
      - name: Cross-compile
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...

  # The tag is the version in mygo.json, and the draft exists before any
  # build starts, so the three platforms upload to one release.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # mygo build only warns about a missing makensis: the row would ship
      # without its installers.
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # -upload publishes the installers and the signed update files, and
      # stops before building when the key is missing: an installed app could
      # not update to a release without a manifest. uploads.github.com answers
      # 404 for a release it has not caught up with yet, and -upload clobbers,
      # so a retry is safe.
      - name: Build and upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if go tool mygo build -platform "${{ matrix.platform }}" -upload; then
              exit 0
            fi
            echo "::warning::Build or upload failed (attempt $attempt of 3), retrying"
            sleep $((attempt * 20))
          done
          exit 1
